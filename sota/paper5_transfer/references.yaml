  url: "https://arxiv.org/abs/2202.01374"
  model: mSLAM
  dataset: FLEURS
  language: Yoruba
  direction: "Source → English"
  metric: BLEU
  score: null
  transfer_type: zero_shot
  summary: >
    Jointly pretrained speech-text model covering 128 languages. Tests zero-shot cross-lingual
    transfer by pretraining on high-resource languages and evaluating on low-resource ones.
    Reports S2TT BLEU on FLEURS for African languages (Yoruba, Hausa, Swahili). Relevant
    as the primary cross-lingual transfer baseline: mSLAM's zero-shot S2TT relies entirely
    on transfer from pretraining, analogous to our zero-shot evaluation setting in LinguoMT-Transfer.
