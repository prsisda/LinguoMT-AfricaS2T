  language: Yoruba
  direction: "ASR"
  metric: WER
  score: null
  transfer_type: cross_lingual_finetune
  summary: >
    Largest multilingual speech model (1B params) via self-supervised cross-lingual pretraining
    on 128 languages including African ones. Fine-tuned with language-specific heads on FLEURS.
    Reports WER per language in Table 4. Key cross-lingual transfer ASR baseline — XLS-R's
    pretraining covers Yoruba and Hausa, making it the strongest self-supervised baseline
    for those languages. Precursor to MMS; XLS-R is used as the backbone in many downstream
    African ASR systems.
  notes: "Fill in WER from Table 4 of arXiv:2111.09296 — FLEURS ASR results"

