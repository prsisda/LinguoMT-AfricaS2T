  url: "https://arxiv.org/abs/2202.01374"
  model: mSLAM
  datasets: [FLEURS]
  language: Yoruba
  directions: ["Source → English"]
  metrics: [BLEU]
  score: null
  transfer_type: zero_shot
  summary: >
    Jointly pretrained speech-text model covering 128 languages. Tests zero-shot cross-lingual
    transfer by pretraining on high-resource languages and evaluating on low-resource ones.
    Reports S2TT BLEU on FLEURS for African languages (Yoruba, Hausa, Swahili).
    Primary cross-lingual transfer baseline — mSLAM's zero-shot performance relies entirely
    on multilingual pretraining, analogous to our zero-shot evaluation setting.
  notes: "Fill in BLEU from supplementary FLEURS S2TT table of arXiv:2202.01374"

