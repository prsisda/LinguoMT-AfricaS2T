- citation_key: costajussa2022nllb_yoruba
  type: article
  author: "Costa-jussà, Marta R. and Cross, James and Çelebi, Onur and Elbayad, Maha and Heafield, Kenneth and Heffernan, Kevin and others"
  title: "No Language Left Behind: Scaling Human-Centered Machine Translation"
  year: 2022
  journal: "arXiv preprint arXiv:2207.04672"
  url: "https://arxiv.org/abs/2207.04672"
  model: NLLB-200-600M
  dataset: Flores-200
  language: Yoruba
  direction: "Text MT (Source → English)"
  metric: spBLEU
  score: null
  summary: >
    Text-only neural MT model covering 200 languages including African ones.
    Evaluated on Flores-200 (written text), NOT on speech — cannot be directly compared
    to S2TT results. Relevant as the MT upper bound for cascade pipelines: if NLLB MT BLEU
    on the written source is X, the cascade S2TT BLEU will always be ≤ X.
    Scores in Table 2 of arXiv:2207.04672 for yor_Latn → eng_Latn.
  notes: "Dataset is Flores-200, not FLEURS. Fill in spBLEU from paper Table 2 (yor_Latn->eng_Latn)"

