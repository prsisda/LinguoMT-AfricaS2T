- citation_key: bentivogli2021cascade_vs_e2e
  type: inproceedings
  author: "Bentivogli, Luisa and Bertoldi, Nicola and Cettolo, Mauro and Conforti, Camille and Federico, Marcello and Fuegen, Christian and Negri, Matteo and Niehues, Jan and Pino, Juan and Salesky, Elizabeth and others"
  title: "Cascade versus Direct Speech Translation: Do the Differences Still Make a Difference?"
  year: 2021
  booktitle: "Proceedings of the 59th Annual Meeting of the Association for Computational Linguistics"
  url: "https://arxiv.org/abs/2106.01045"
  model: "Cascade (ASR + NMT)"
  datasets: [MuST-C]
  language: English
  directions: ["Source → German", "Source → Italian", "Source → Dutch"]
  metrics: [BLEU]
  score: null
  architecture: cascade
  summary: >
    Comprehensive comparison of cascade (ASR+MT) vs. direct (E2E) speech translation at IWSLT 2021.
    Shows cascade systems still outperform E2E on high-resource European pairs (en→de, en→it, en→nl).
    Evaluated on MuST-C — NOT on FLEURS or African languages.
    Relevant as the key architectural comparison reference: we extend this question to low-resource
    African languages where data conditions are very different from European high-resource settings.
  notes: "European language pairs only (MuST-C). Architectural framing reference, not direct comparator"

