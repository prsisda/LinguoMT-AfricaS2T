- citation_key: costajussa2022nllb_cascade_igbo
  type: article
  author: "Costa-jussà, Marta R. and Cross, James and Çelebi, Onur and Elbayad, Maha and Heafield, Kenneth and Heffernan, Kevin and others"
  title: "No Language Left Behind: Scaling Human-Centered Machine Translation"
  year: 2022
  journal: "arXiv preprint arXiv:2207.04672"
  url: "https://arxiv.org/abs/2207.04672"
  model: "NLLB-200-600M (MT component in cascade)"
  dataset: Flores-200
  language: Igbo
  direction: "Text MT (Source → English)"
  metric: spBLEU
  score: null
  architecture: cascade
  summary: >
    NLLB-200 text MT spBLEU on Flores-200 for Igbo (ibo_Latn → eng_Latn). Used as the
    MT component ceiling for Igbo cascade pipelines: if NLLB text MT scores X on Flores-200,
    the cascade S2TT BLEU is bounded above by X (assuming perfect ASR). The gap between
    cascade S2TT BLEU and this ceiling reveals ASR error propagation impact.
    Score in Table 2 of arXiv:2207.04672.
  notes: "Text MT ceiling (Flores-200, not FLEURS). Fill in spBLEU from Table 2 (ibo_Latn->eng_Latn)"
