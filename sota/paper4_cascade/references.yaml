# references.yaml — Paper 4: LinguoMT-Cascade
# Cascade vs. end-to-end speech translation architecture comparison baselines.
# Fill in 'score' for each entry to enable automatic comparison tables.
# See README.md and schema.json for field descriptions.
#
# Required comparison fields: model, dataset, language, direction, metric, score, architecture
# Optional: notes, url, year, summary

- citation_key: bentivogli2021cascade_vs_e2e
  type: inproceedings
  author: "Bentivogli, Luisa and Bertoldi, Nicola and Cettolo, Mauro and Conforti, Camille and Federico, Marcello and Fuegen, Christian and Negri, Matteo and Niehues, Jan and Pino, Juan and Salesky, Elizabeth and others"
  title: "Cascade versus Direct Speech Translation: Do the Differences Still Make a Difference?"
  year: 2021
  booktitle: "Proceedings of the 59th Annual Meeting of the Association for Computational Linguistics"
  url: "https://arxiv.org/abs/2106.01045"
  model: "Cascade (ASR + NMT)"
  dataset: MuST-C
  language: English
  direction: "English → German/Italian/Dutch (European pairs)"
  metric: BLEU
  score: null
  architecture: cascade
  summary: >
    Comprehensive analysis of cascade (ASR+MT) vs. direct (E2E) speech translation at
    IWSLT 2021. Shows cascade systems still outperform E2E on high-resource European pairs
    (en→de, en→it, en→nl) despite E2E gap closing. Evaluated on MuST-C, not FLEURS or
    African languages. Relevant as the key architectural comparison reference: we extend
    this question to low-resource African languages where data conditions are very different.
  notes: "European language pairs only (MuST-C). Not directly comparable — use as architectural framing reference"

- citation_key: inaguma2020espnetst_yoruba
  type: inproceedings
  author: "Inaguma, Hirofumi and Kiyono, Shun and Duh, Kevin and Karita, Shigeki and Yalta, Nelson and Hayashi, Tomoki and Watanabe, Shinji"
  title: "ESPnet-ST: All-in-One Speech Translation Toolkit"
  year: 2020
  booktitle: "Proceedings of the 58th Annual Meeting of the Association for Computational Linguistics: System Demonstrations"
  url: "https://arxiv.org/abs/2004.10234"
  model: "ESPnet-ST (cascade)"
  dataset: MuST-C
  language: English
  direction: "English → German/French/Spanish"
  metric: BLEU
  score: null
  architecture: cascade
  summary: >
    Describes ESPnet-ST toolkit implementing both cascade (ASR+MT) and E2E speech translation.
    Evaluated on MuST-C en→de, en→fr, en→es. Does not cover African languages or FLEURS.
    Relevant as a toolkit reference for cascade pipeline implementation — ESPnet-ST's
    cascade design mirrors our Whisper+NLLB pipeline. Use for citing cascade implementation
    methodology, not as an African language performance comparator.
  notes: "European language pairs (MuST-C). Architecture reference only"

