# references.yaml — Paper 2: LinguoMT-Adapt
# Fine-tuning and adaptation baselines for African language speech translation.
# Fill in 'score' for each entry to enable automatic comparison tables.
# See README.md and schema.json for field descriptions.
#
# Required comparison fields: model, dataset, language, direction, metric, score, ft_method
# Optional: notes, url, year, summary

- citation_key: hu2022lora
  type: article
  author: "Hu, Edward J. and Shen, Yelong and Wallis, Phillip and Allen-Zhu, Zeyuan and Li, Yuanzhi and Wang, Shean and Wang, Lu and Chen, Weizhu"
  title: "LoRA: Low-Rank Adaptation of Large Language Models"
  year: 2022
  journal: "International Conference on Learning Representations (ICLR 2022)"
  url: "https://arxiv.org/abs/2106.09685"
  model: LoRA (general)
  dataset: "Various NLP benchmarks"
  language: "English (methodology paper)"
  direction: "N/A (text classification and generation)"
  metric: null
  score: null
  ft_method: lora
  summary: >
    Foundational paper introducing LoRA (Low-Rank Adaptation) for parameter-efficient
    fine-tuning of large language models. Introduces the concept of freezing pretrained weights
    and injecting trainable low-rank decomposition matrices. Not evaluated on speech or African
    languages directly — relevant as the methodology reference for the LoRA approach used in
    LinguoMT-Adapt. Use for citing the adaptation method, not as a direct performance comparator.
  notes: "Methodology reference — not a direct performance baseline"

- citation_key: olatunji2023afrispeech_hausa
  type: inproceedings
  author: "Olatunji, Tobi and Wairagala, Eric Peter and Mukiibi, Samuel and Naous, Tamer and Odunowo, Tejumade and Azime, Israel Abebe and Emezue, Chris Chinenye and others"
  title: "AfriSpeech-200: Pan-African Accented Speech Dataset for Clinical and General Domain ASR"
  year: 2023
  booktitle: "Findings of the Association for Computational Linguistics: ACL 2023"
  url: "https://arxiv.org/abs/2104.02010"
  model: Whisper-large-v2 (fine-tuned)
  dataset: AfriSpeech-200
  language: Hausa
  direction: "ASR"
  metric: WER
  score: null
  ft_method: full_finetune
  summary: >
    Introduces AfriSpeech-200, a pan-African accented English speech dataset covering
    clinical and general domains across multiple African countries. Fine-tunes Whisper on
    accented African English (not African-language ASR). Relevant for adaptation: shows
    that Whisper WER on African speech improves substantially with domain-specific fine-tuning.
    Evaluate whether Hausa-accented English is separately reported in Table 4.
  notes: "Dataset covers African-accented English, not African-language ASR. Check Table 4 for WER"

