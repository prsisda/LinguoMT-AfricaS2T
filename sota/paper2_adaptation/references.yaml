- citation_key: bapna2019simple_adapters
  type: article
  author: "Bapna, Ankur and Firat, Orhan"
  title: "Simple, Scalable Adaptation for Neural Machine Translation"
  year: 2019
  journal: "Proceedings of the 2019 Conference on Empirical Methods in Natural Language Processing"
  url: "https://arxiv.org/abs/1909.08478"
  model: Transformer + Adapters
  dataset: WMT
  language: "Multiple (English-centric)"
  direction: "Text MT (Source → English)"
  metric: BLEU
  score: null
  ft_method: adapter
  summary: >
    Introduces lightweight adapter modules inserted into pretrained Transformer layers
    for domain/language adaptation in NMT. Only ~1–3% of parameters trained per task.
    Not evaluated on African languages — relevant as the adapter methodology reference.
    Predates LoRA; LoRA (Hu et al. 2022) is the PEFT method we use in practice.
    Cite alongside LoRA to position the adaptation methodology landscape.
  notes: "Methodology reference — English-centric WMT, not directly comparable"

