  datasets: [FLEURS]
  language: Yoruba
  directions: ["Source → English"]
  metrics: [BLEU]
  score: null
  ft_method: none
  summary: >
    Describes SeamlessM4T-v2 with improved multilingual coverage. Reports S2TT BLEU on FLEURS
    for African languages in Table B.1. Used as the zero-shot (pre-training only) baseline for
    LinguoMT-Adapt — our fine-tuning results should be compared against this to quantify the
    adaptation gain. Fine-tuning delta BLEU = our score − this baseline.
  notes: "Zero-shot baseline (no fine-tuning). Fill in BLEU from Table B.1 of arXiv:2312.05187"

