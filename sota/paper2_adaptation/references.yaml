- citation_key: bapna2019simple_adapters
  type: article
  author: "Bapna, Ankur and Firat, Orhan"
  title: "Simple, Scalable Adaptation for Neural Machine Translation"
  year: 2019
  journal: "Proceedings of the 2019 Conference on Empirical Methods in Natural Language Processing"
  url: "https://arxiv.org/abs/1909.08478"
  model: "Transformer + Adapters"
  datasets: [WMT]
  language: "Multiple (English-centric)"
  directions: ["Text MT (Source → English)"]
  metrics: [BLEU]
  score: null
  ft_method: adapter
  summary: >
    Introduces lightweight adapter modules inserted into pretrained Transformer layers
    for domain/language adaptation in NMT. Trains only ~1–3% of parameters per task.
    Evaluated on English-centric WMT pairs — not on African languages.
    Relevant as the adapter methodology reference; positions our LoRA approach in the
    PEFT landscape. Not a direct performance comparator.
  notes: "Methodology reference — English-centric WMT pairs only"

- citation_key: seamlesscommunication2023seamless_yoruba
  type: article
  author: "Seamless Communication and Barrault, Loïc and Chung, Yu-An and Meglioli, Mariano Coria and Dale, David and Dong, Ning and others"
