  type: inproceedings
  author: "Dossou, Bonaventure F. P. and Emezue, Chris Chinenye and Opoku, Nelda and Olatunji, Tobi and Osei, Salomey and Ameka, Grace Nsiroma and others"
  title: "MasakhaSpeech: End-to-End Speech Recognition for 5 African Languages"
  year: 2022
  booktitle: "Proceedings of Interspeech 2022"
  url: "https://arxiv.org/abs/2206.00253"
  model: "Wav2Vec2-XLSR (fine-tuned)"
  datasets: [MasakhaSpeech]
  language: Hausa
  directions: [ASR]
  metrics: [WER]
  score: null
  ft_method: full_finetune
  summary: >
    Introduces MasakhaSpeech corpus and fine-tunes Wav2Vec2-XLSR on 5 African languages:
    Hausa, Igbo, Yoruba, Swahili, and Wolof. Reports WER per language after full fine-tuning
    on limited training data (~10h per language). Direct adaptation baseline for Hausa ASR
    fine-tuning — shows what full fine-tuning achieves with ~10h of data. Scores in Table 2.
  notes: "Fill in Hausa WER from Table 2 of arXiv:2206.00253"

