# references.yaml — Paper 3: LinguoMT-Audio
# Audio robustness baselines for African language speech translation.
# Fill in 'score' for each entry to enable automatic comparison tables.
# See README.md and schema.json for field descriptions.
#
# Required comparison fields: model, dataset, language, direction, metric, score, audio_condition
# Optional: notes, url, year, summary

- citation_key: park2019specaugment
  type: inproceedings
  author: "Park, Daniel S. and Chan, William and Zhang, Yu and Chiu, Chung-Cheng and Zoph, Barret and Cubuk, Ekin D. and Le, Quoc V."
  title: "SpecAugment: A Simple Data Augmentation Method for Automatic Speech Recognition"
  year: 2019
  booktitle: "Proceedings of Interspeech 2019"
  url: "https://arxiv.org/abs/1904.08779"
  model: Listen Attend and Spell + SpecAugment
  dataset: LibriSpeech
  language: English
  direction: "ASR"
  metric: WER
  score: null
  audio_condition: augmented
  summary: >
    Introduces SpecAugment, a data augmentation technique for ASR that masks frequency
    and time bands in log-mel spectrograms. Evaluated on LibriSpeech (English only);
    not evaluated on African languages. Relevant as the foundational audio augmentation
    methodology. In LinguoMT-Audio, we apply similar augmentation to assess robustness
    on African speech — this paper provides the methodological grounding.
  notes: "Methodology reference — English LibriSpeech only, not directly comparable"

- citation_key: radford2023whisper_robustness_yoruba
  type: inproceedings
  author: "Radford, Alec and Kim, Jong Wook and Xu, Tao and Brockman, Greg and McLeavey, Christine and Sutskever, Ilya"
  title: "Robust Speech Recognition via Large-Scale Weak Supervision"
  year: 2023
  booktitle: "Proceedings of the 40th International Conference on Machine Learning (ICML 2023)"
  url: "https://arxiv.org/abs/2212.04356"
  model: Whisper-large-v3
  dataset: FLEURS
  language: Yoruba
  direction: "ASR"
  metric: WER
  score: null
  audio_condition: clean
  summary: >
    Whisper is trained on 680k hours of weakly supervised audio across 100+ languages.
    Reports ASR WER on FLEURS (clean, studio-recorded) for many languages including Yoruba
    and Hausa. Key claim is robustness to accents, noise, and channel variation due to
    diverse training data. Relevant as the clean-audio ASR baseline: LinguoMT-Audio
    measures WER degradation under noise/augmentation relative to this clean baseline.
  notes: "Clean-audio baseline. Fill in WER from HuggingFace model card FLEURS eval"

