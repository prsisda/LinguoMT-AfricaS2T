  datasets: [Flores-200]
  language: Yoruba
  directions: ["Text MT (Source → English)"]
  metrics: [spBLEU]
  score: null
  summary: >
    Text-only neural MT model covering 200 languages. Evaluated on Flores-200 written text,
    NOT on speech — cannot be directly compared to S2TT results.
    Relevant as the MT upper bound for cascade pipelines: NLLB text MT BLEU on the written source
    is the ceiling for cascade S2TT BLEU (assuming perfect ASR).
    Scores in Table 2 for yor_Latn → eng_Latn.
  notes: "Dataset is Flores-200, not FLEURS. Fill in spBLEU from Table 2 (yor_Latn->eng_Latn)"

